<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1632" viewBox="0 0 600 1632" role="img" aria-labelledby="title desc">
<title id="title">CDSP and RAC foundation: direct imports</title><desc id="desc">Direct theory imports in the CDSP and RAC foundation. Arrows run from dependency to importing theory. Standard Isabelle library imports are omitted; ADS_Functor imports are grouped by AFP session. The separate session overview includes all seven registered artifacts.</desc>

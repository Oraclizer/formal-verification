<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Oraclizer Formal Verification</title>
  <desc id="desc">Independent formal verification artifacts mechanized in Isabelle/HOL, represented by a calibrated commutative proof diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".58" stop-color="#10182d"/>
      <stop offset="1" stop-color="#13273b"/>
    </linearGradient>
    <linearGradient id="proof-field" x1="70" y1="70" x2="188" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a38aff"/>
      <stop offset=".48" stop-color="#7c9df5"/>
      <stop offset="1" stop-color="#55d3e8"/>
    </linearGradient>
    <linearGradient id="domain-left" x1="76" y1="80" x2="126" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b5a2ff"/>
      <stop offset="1" stop-color="#806ee9"/>
    </linearGradient>
    <linearGradient id="domain-right" x1="178" y1="80" x2="130" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78deed"/>
      <stop offset="1" stop-color="#4c9fd2"/>
    </linearGradient>
    <radialGradient id="aperture" cx="50%" cy="45%" r="64%">
      <stop offset="0" stop-color="#162844"/>
      <stop offset=".72" stop-color="#0b1428"/>
      <stop offset="1" stop-color="#070c18"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a83f8"/>
      <stop offset=".5" stop-color="#5caed8"/>
      <stop offset="1" stop-color="#5caed8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#bdd6ee" stroke-width="1" opacity=".035"/>
      <circle cx="0" cy="0" r="1.1" fill="#9fc4df" opacity=".08"/>
    </pattern>
    <filter id="depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02040b" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <path d="M310 34v232M329 34v232" stroke="#8f9de8" stroke-width="1" opacity=".13"/>
  <path d="M350 250h760" stroke="url(#rule)" stroke-width="2"/>
  <path d="M1092 57h50v50M1142 193v50h-50" fill="none" stroke="#9dc7df" stroke-width="2" opacity=".16"/>
  <path d="M366 43h118M366 47h72" stroke="#8b7be7" stroke-width="1" opacity=".12"/>

  <g transform="translate(31 4) scale(1.14)">
    <circle cx="128" cy="128" r="109" fill="#050914" opacity=".72"/>
    <circle cx="128" cy="128" r="106" fill="none" stroke="#8f83eb" stroke-width="1.5" opacity=".2"/>
    <circle cx="128" cy="128" r="101" fill="url(#aperture)" stroke="#33476b" stroke-width="2"/>
    <circle cx="128" cy="128" r="91" fill="none" stroke="url(#proof-field)" stroke-width="2" stroke-dasharray="1.6 9.98" opacity=".7"/>
    <circle cx="128" cy="128" r="78" fill="#0d1730" stroke="#314970" stroke-width="1.5"/>

    <g fill="#b7a9ff" opacity=".88">
      <rect x="125" y="28" width="6" height="13" rx="3"/>
      <rect x="125" y="215" width="6" height="13" rx="3"/>
    </g>
    <g fill="#6ccfe5" opacity=".82">
      <rect x="28" y="125" width="13" height="6" rx="3"/>
      <rect x="215" y="125" width="13" height="6" rx="3"/>
    </g>
    <g fill="#7897ce" opacity=".72">
      <circle cx="63" cy="63" r="3"/>
      <circle cx="193" cy="63" r="3"/>
      <circle cx="193" cy="193" r="3"/>
      <circle cx="63" cy="193" r="3"/>
    </g>

    <path d="M128 51v22M128 183v22M51 128h22M183 128h22" fill="none" stroke="#7996c5" stroke-width="1.5" opacity=".42"/>
    <path d="M74 74h108v108H74Z" fill="none" stroke="#030711" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#depth)"/>
    <path d="M74 74h108M74 182h108" fill="none" stroke="url(#proof-field)" stroke-width="7" stroke-linecap="round"/>
    <path d="M74 74v108" fill="none" stroke="url(#domain-left)" stroke-width="7" stroke-linecap="round"/>
    <path d="M182 74v108" fill="none" stroke="url(#domain-right)" stroke-width="7" stroke-linecap="round"/>

    <g fill="none" stroke="#dce9f8" stroke-width="1.4" stroke-linecap="round" opacity=".67">
      <path d="M78 65h100"/>
      <path d="M78 191h100"/>
      <path d="M65 78v100"/>
      <path d="M191 78v100"/>
    </g>
    <g fill="none" stroke="#dbe8f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
      <path d="m124 67 8 7-8 7"/>
      <path d="m124 175 8 7-8 7"/>
      <path d="m67 124 7 8 7-8"/>
      <path d="m175 124 7 8 7-8"/>
    </g>

    <g stroke="#0c1730" stroke-width="4">
      <circle cx="74" cy="74" r="8" fill="#baaaff"/>
      <circle cx="74" cy="182" r="8" fill="#927ef2"/>
      <circle cx="182" cy="74" r="8" fill="#7bdfed"/>
      <circle cx="182" cy="182" r="8" fill="#59afd8"/>
    </g>
    <g fill="#dae7f4" opacity=".7">
      <circle cx="74" cy="74" r="2.2"/>
      <circle cx="74" cy="182" r="2.2"/>
      <circle cx="182" cy="74" r="2.2"/>
      <circle cx="182" cy="182" r="2.2"/>
    </g>

    <path d="m128 96 32 32-32 32-32-32Z" fill="#0b162d" stroke="#6886b5" stroke-width="2"/>
    <path d="M105 105l46 46M151 105l-46 46" fill="none" stroke="url(#proof-field)" stroke-width="2" opacity=".62"/>
    <circle cx="128" cy="128" r="19" fill="#081023" stroke="#d8e8f6" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="10" fill="none" stroke="#7896c8" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="128" cy="128" r="4.5" fill="#f2f6ff" filter="url(#glow)"/>
    <circle cx="128" cy="128" r="1.8" fill="#476ca1"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="348" y="64" fill="#9d91ee" font-size="13" font-weight="700" letter-spacing="2.35">ISABELLE/HOL  •  MECHANIZED ARTIFACT</text>
    <text x="344" y="130" fill="#f4f6ff" font-size="60" font-weight="750" letter-spacing="1.2">FORMAL VERIFICATION</text>
    <rect x="348" y="150" width="54" height="4" rx="2" fill="#9b83f7"/>
    <text x="348" y="190" fill="#c6d7f2" font-size="23" font-weight="650" letter-spacing=".82">COMPOSABLE, SESSION-SCOPED PROOF ARTIFACTS</text>
    <text x="348" y="230" fill="#9daec6" font-size="17" letter-spacing=".16">Machine-checked models  •  reproducible releases  •  explicit assurance boundaries</text>
  </g>
</svg>

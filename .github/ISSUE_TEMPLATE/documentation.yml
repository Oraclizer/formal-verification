name: Documentation problem
description: Report a broken link, citation, rendering defect, ambiguity, or missing boundary
title: "[Docs] "
body:
  - type: input
    id: location
    attributes:
      label: Document and section
      placeholder: README.md, Assurance boundary
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Exact commit
      placeholder: 40-character Git commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction

name: Proofs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: proofs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protected-behavior-obstructions:
    name: Isabelle2025-2 / Protected Behavior Obstructions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ISABELLE_SHA256: a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c
      ISABELLE_URL: https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/Isabelle2025-2_linux.tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore cached Isabelle archive
        id: isabelle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Isabelle2025-2_linux.tar.gz
          key: isabelle-${{ env.ISABELLE_SHA256 }}
      - name: Install pinned Isabelle2025-2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Isabelle2025-2_linux.tar.gz"
          isabelle_home="$RUNNER_TEMP/Isabelle2025-2"
          if [ ! -f "$archive" ]; then
            curl --fail --location \
              --connect-timeout 30 --max-time 1800 \
              --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
              --output "$archive" "$ISABELLE_URL"
          fi
          echo "$ISABELLE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$isabelle_home/bin/isabelle" version)" = "Isabelle2025-2"
      - name: Build Protected_Behavior_Obstructions named session
        shell: bash
        run: >-
          "$RUNNER_TEMP/Isabelle2025-2/bin/isabelle" build
          -D Protected_Behavior_Obstructions
          Protected_Behavior_Obstructions

  cross-domain-state-preservation:
    # Cross_Domain_State_Preservation depends on the AFP entry ADS_Functor, and
    # Regulatory_Action_Composition extends Cross_Domain_State_Preservation, so
    # both named sessions are built here against the same pinned dependency.
    name: Isabelle2025-2 / Cross-Domain State Preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISABELLE_SHA256: a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c
      ISABELLE_URL: https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/Isabelle2025-2_linux.tar.gz
      AFP_ADS_FUNCTOR_SHA256: 10d6fa8671c461022ae5e71859a07610d616681fed79e2f1c81029a124203c85
      AFP_ADS_FUNCTOR_URL: https://isa-afp.org/release/afp-ADS_Functor-2026-02-06.tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore cached Isabelle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Isabelle2025-2_linux.tar.gz
          key: isabelle-${{ env.ISABELLE_SHA256 }}
      - name: Restore cached AFP ADS_Functor archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/afp-ADS_Functor.tar.gz
          key: afp-ads-functor-${{ env.AFP_ADS_FUNCTOR_SHA256 }}
      - name: Install pinned Isabelle2025-2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Isabelle2025-2_linux.tar.gz"
          isabelle_home="$RUNNER_TEMP/Isabelle2025-2"
          if [ ! -f "$archive" ]; then
            curl --fail --location \
              --connect-timeout 30 --max-time 1800 \
              --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
              --output "$archive" "$ISABELLE_URL"
          fi
          echo "$ISABELLE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$isabelle_home/bin/isabelle" version)" = "Isabelle2025-2"
      - name: Install pinned AFP entry ADS_Functor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/afp-ADS_Functor.tar.gz"
          if [ ! -f "$archive" ]; then
            curl --fail --location \
              --connect-timeout 30 --max-time 600 \
              --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
              --output "$archive" "$AFP_ADS_FUNCTOR_URL"
          fi
          # The URL pins the dated AFP release and the digest pins its bytes. A
          # mismatch means the archive changed and must be reviewed, not silently
          # accepted.
          echo "$AFP_ADS_FUNCTOR_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/afp"
          tar -xzf "$archive" -C "$RUNNER_TEMP/afp"
          test -f "$RUNNER_TEMP/afp/ADS_Functor/ROOT"
      - name: Build Cross_Domain_State_Preservation and Regulatory_Action_Composition
        shell: bash
        # `isabelle build -d DIR` requires ROOT or ROOTS directly inside DIR, so the
        # entry directory itself is passed, not the extraction parent.
        run: >-
          "$RUNNER_TEMP/Isabelle2025-2/bin/isabelle" build
          -d "$RUNNER_TEMP/afp/ADS_Functor"
          -d .
          Cross_Domain_State_Preservation
          Regulatory_Action_Composition

  Proofs:
    # Single aggregate check for the proof lane. Branch protection requires this
    # job together with the repository-health aggregate, so the required-check
    # list survives job renames. Every real proof job must be listed in `needs`.
    name: Proofs
    if: always()
    needs:
      - protected-behavior-obstructions
      - cross-domain-state-preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any proof job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more proof jobs did not succeed."
          exit 1
      - name: All proof jobs succeeded
        run: echo "ok"

name: Proofs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: proofs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ISABELLE_SHA256: a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c
  ISABELLE_URL: https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/Isabelle2025-2_linux.tar.gz
  AFP_ADS_FUNCTOR_SHA256: 10d6fa8671c461022ae5e71859a07610d616681fed79e2f1c81029a124203c85
  AFP_ADS_FUNCTOR_URL: https://isa-afp.org/release/afp-ADS_Functor-2026-02-06.tar.gz

jobs:
  affected-sessions:
    name: Select affected sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      protected: ${{ steps.select.outputs.protected }}
      product_sessions: ${{ steps.select.outputs.product_sessions }}
      audit: ${{ steps.select.outputs.audit }}
      force_all: ${{ steps.select.outputs.force_all }}
    steps:
      - name: Check out source and comparison commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the complete affected-session closure
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only -z "$merge_base" "$HEAD_SHA" |
              node scripts/select-proof-sessions.mjs --null
          else
            # A merge to main and a manual run are coherent release checkpoints:
            # validate the complete graph, independent companion and audit.
            node scripts/select-proof-sessions.mjs --all
          fi
      - name: Explain the selected validation boundary
        run: |
          echo "force_all=${{ steps.select.outputs.force_all }}"
          echo "protected=${{ steps.select.outputs.protected }}"
          echo "product_sessions=${{ steps.select.outputs.product_sessions }}"
          echo "audit=${{ steps.select.outputs.audit }}"

  source-integrity:
    name: Proof source integrity
    needs: affected-sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test affected-session selection and theory coverage
        run: node --test scripts/select-proof-sessions.test.mjs
      - name: Reject untrusted proof source forms
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^\s*(sorry|oops|axiomatization|oracle)\b|\bby\s+eval\b|\bnative_decide\b|\bskip_proof\b|\bsledgehammer\b|\bsmt_oracle\b' \
            Cross_Domain_State_Preservation Regulatory_Action_Composition Cross_Chain_Message_Integrity Preemptive_Lock_Correctness Evidence_Atomic_Binding Evidence_Binding_Composition Protected_Behavior_Obstructions --include='*.thy'; then
            exit 1
          fi
      - name: Verify model source manifests
        run: |
          node Cross_Chain_Message_Integrity/verify-source.mjs
          node Preemptive_Lock_Correctness/verify-source.mjs
          node Evidence_Atomic_Binding/verify-source.mjs
          node Evidence_Binding_Composition/verify-source.mjs

  protected-behavior-obstructions:
    name: Isabelle2025-2 / Protected Behavior Obstructions
    if: needs.affected-sessions.outputs.protected == 'true'
    needs: affected-sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore cached Isabelle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Isabelle2025-2_linux.tar.gz
          key: isabelle-${{ env.ISABELLE_SHA256 }}
      - name: Install pinned Isabelle2025-2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Isabelle2025-2_linux.tar.gz"
          isabelle_home="$RUNNER_TEMP/Isabelle2025-2"
          if [ ! -f "$archive" ]; then
            curl --fail --location \
              --connect-timeout 30 --max-time 1800 \
              --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
              --output "$archive" "$ISABELLE_URL"
          fi
          echo "$ISABELLE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$isabelle_home/bin/isabelle" version)" = "Isabelle2025-2"
      - name: Restore verified Isabelle heaps as an accelerator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.isabelle/Isabelle2025-2/heaps
          key: proof-heaps-protected-${{ runner.os }}-${{ env.ISABELLE_SHA256 }}-${{ hashFiles('Protected_Behavior_Obstructions/ROOT', 'Protected_Behavior_Obstructions/*.thy', '.github/workflows/proofs.yml') }}
          restore-keys: |
            proof-heaps-protected-${{ runner.os }}-${{ env.ISABELLE_SHA256 }}-
      - name: Build the affected independent session
        shell: bash
        run: >-
          "$RUNNER_TEMP/Isabelle2025-2/bin/isabelle" build
          -j 1 -o threads=1 -o parallel_proofs=0
          -D Protected_Behavior_Obstructions
          Protected_Behavior_Obstructions

  product-model-sessions:
    name: Isabelle2025-2 / Affected product sessions
    if: needs.affected-sessions.outputs.product_sessions != '' || needs.affected-sessions.outputs.audit == 'true'
    needs: affected-sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore cached Isabelle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Isabelle2025-2_linux.tar.gz
          key: isabelle-${{ env.ISABELLE_SHA256 }}
      - name: Restore cached AFP ADS_Functor archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/afp-ADS_Functor.tar.gz
          key: afp-ads-functor-${{ env.AFP_ADS_FUNCTOR_SHA256 }}
      - name: Install pinned Isabelle2025-2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Isabelle2025-2_linux.tar.gz"
          isabelle_home="$RUNNER_TEMP/Isabelle2025-2"
          if [ ! -f "$archive" ]; then
            curl --fail --location \
              --connect-timeout 30 --max-time 1800 \
              --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
              --output "$archive" "$ISABELLE_URL"
          fi
          echo "$ISABELLE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test "$("$isabelle_home/bin/isabelle" version)" = "Isabelle2025-2"
      - name: Install pinned AFP entry ADS_Functor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/afp-ADS_Functor.tar.gz"
          if [ ! -f "$archive" ]; then
            curl --fail --location \
              --connect-timeout 30 --max-time 600 \
              --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
              --output "$archive" "$AFP_ADS_FUNCTOR_URL"
          fi
          echo "$AFP_ADS_FUNCTOR_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/afp"
          tar -xzf "$archive" -C "$RUNNER_TEMP/afp"
          test -f "$RUNNER_TEMP/afp/ADS_Functor/ROOT"
      - name: Restore verified Isabelle heaps as an accelerator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Isabelle still checks current sources, options and parent heaps. A
          # restored heap never turns a stale session into a successful check.
          path: ~/.isabelle/Isabelle2025-2/heaps
          key: proof-heaps-product-${{ runner.os }}-${{ env.ISABELLE_SHA256 }}-${{ env.AFP_ADS_FUNCTOR_SHA256 }}-${{ hashFiles('ROOTS', 'Cross_Domain_State_Preservation/ROOT', 'Cross_Domain_State_Preservation/*.thy', 'Regulatory_Action_Composition/ROOT', 'Regulatory_Action_Composition/*.thy', 'Cross_Chain_Message_Integrity/ROOT', 'Cross_Chain_Message_Integrity/*.thy', 'Preemptive_Lock_Correctness/ROOT', 'Preemptive_Lock_Correctness/*.thy', 'Evidence_Atomic_Binding/ROOT', 'Evidence_Atomic_Binding/*.thy', 'Evidence_Binding_Composition/ROOT', 'Evidence_Binding_Composition/*.thy', 'Evidence_Binding_Composition/Audit/ROOT', 'Evidence_Binding_Composition/Audit/*.thy', '.github/workflows/proofs.yml') }}
          restore-keys: |
            proof-heaps-product-${{ runner.os }}-${{ env.ISABELLE_SHA256 }}-${{ env.AFP_ADS_FUNCTOR_SHA256 }}-
      - name: Build every affected product session
        if: needs.affected-sessions.outputs.product_sessions != ''
        shell: bash
        env:
          AFFECTED_SESSIONS: ${{ needs.affected-sessions.outputs.product_sessions }}
        run: |
          set -euo pipefail
          read -r -a sessions <<< "$AFFECTED_SESSIONS"
          "$RUNNER_TEMP/Isabelle2025-2/bin/isabelle" build \
            -j 1 -o threads=1 -o parallel_proofs=0 \
            -d "$RUNNER_TEMP/afp/ADS_Functor" -d . \
            "${sessions[@]}"
      - name: Build and verify the affected composition audit
        if: needs.affected-sessions.outputs.audit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/composition-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir"
          cp Evidence_Binding_Composition/Audit/ROOT "$audit_dir/"
          cp Evidence_Binding_Composition/Audit/*.thy "$audit_dir/"
          "$RUNNER_TEMP/Isabelle2025-2/bin/isabelle" build \
            -c -b -j 1 -o threads=1 -o parallel_proofs=0 \
            -d "$RUNNER_TEMP/afp/ADS_Functor" -d . -d "$audit_dir" \
            Composition_Proof_Audit
          node Evidence_Binding_Composition/verify-proof-output.mjs "$audit_dir"

  Proofs:
    # Stable branch-protection check. Native jobs may be intentionally skipped
    # for documentation-only or disjoint changes; requested jobs must succeed.
    name: Proofs
    if: always()
    needs:
      - affected-sessions
      - source-integrity
      - protected-behavior-obstructions
      - product-model-sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected validation boundary to succeed
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.affected-sessions.result }}
          SOURCE_RESULT: ${{ needs.source-integrity.result }}
          PROTECTED_REQUESTED: ${{ needs.affected-sessions.outputs.protected }}
          PROTECTED_RESULT: ${{ needs.protected-behavior-obstructions.result }}
          PRODUCT_SESSIONS: ${{ needs.affected-sessions.outputs.product_sessions }}
          AUDIT_REQUESTED: ${{ needs.affected-sessions.outputs.audit }}
          PRODUCT_RESULT: ${{ needs.product-model-sessions.result }}
        run: |
          set -euo pipefail
          if [[ "$SELECT_RESULT" != "success" || "$SOURCE_RESULT" != "success" ]]; then
            echo "::error::Session selection or proof-source integrity did not succeed."
            exit 1
          fi
          if [[ "$PROTECTED_REQUESTED" == "true" && "$PROTECTED_RESULT" != "success" ]]; then
            echo "::error::The selected protected-obstruction build did not succeed."
            exit 1
          fi
          if [[ "$PROTECTED_RESULT" == "failure" || "$PROTECTED_RESULT" == "cancelled" ]]; then
            echo "::error::The protected-obstruction build failed unexpectedly."
            exit 1
          fi
          if [[ -n "$PRODUCT_SESSIONS" || "$AUDIT_REQUESTED" == "true" ]]; then
            if [[ "$PRODUCT_RESULT" != "success" ]]; then
              echo "::error::The selected product/audit build did not succeed."
              exit 1
            fi
          fi
          if [[ "$PRODUCT_RESULT" == "failure" || "$PRODUCT_RESULT" == "cancelled" ]]; then
            echo "::error::The product/audit build failed unexpectedly."
            exit 1
          fi
          echo "Selected proof validation succeeded."

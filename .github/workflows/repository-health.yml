name: Repository health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-surface:
    name: Public repository surface
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public surface and local links
        run: node scripts/verify-repository-health.mjs

  required:
    # Single aggregate check for the surface lane. Branch protection requires
    # this job and the Proofs aggregate in .github/workflows/proofs.yml, so the
    # required-check list survives job renames and matrix changes. Every real
    # job in this workflow must be listed in `needs`.
    name: required
    if: always()
    needs:
      - public-surface
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more required jobs did not succeed."
          exit 1
      - name: All required jobs succeeded
        run: echo "ok"
